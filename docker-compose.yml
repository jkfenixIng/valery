services:
  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-17-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-valery_dev}
      POSTGRES_USER: ${POSTGRES_USER:-valery_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-valery_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - valery_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  valery_postgres_data:
